[project]
name = "research-copilot-backend"
version = "0.1.0"
description = "Enterprise Multi-Agent RAG Research Copilot Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "redis>=5.0.3",
    "arq>=0.25.0",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "pypdf>=4.1.0",
    "sentence-transformers>=2.6.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.40",
    "rapidfuzz>=3.8.0",
    "tenacity>=8.2.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "freezegun>=1.4.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.3"
]

[tool.ruff]
line-length = 100
target-version = "py311"
ignore = ["EXE002", "B008", "BLE001"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit",
    "integration",
    "api",
    "slow",
    "benchmark"
]

[tool.setuptools.packages.find]
include = ["app*"]
